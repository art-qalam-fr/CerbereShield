# Build + signature SignPath — Cerbere Security Shield
#
# Secrets requis (repo Settings → Secrets and variables → Actions) :
#   SIGNPATH_API_TOKEN         — token API SignPath (My profile → Generate token)
#   SIGNPATH_ORGANIZATION_ID   — GUID de l'organisation SignPath
#
# Declenchement : Actions → "Release signee" → Run workflow.
# La policy "test-signing" utilise le certificat auto-signe ; apres
# approbation SignPath Foundation, passer signing_policy a "release-signing".

name: Release signée

on:
  workflow_dispatch:
    inputs:
      project_slug:
        description: "Slug du projet SignPath"
        required: true
        default: "cerbere-security-shield"
      signing_policy:
        description: "Policy de signature"
        required: true
        default: "Test_signing"
      publish_release:
        description: "Creer une GitHub Release avec les artefacts signes"
        type: boolean
        required: true
        default: false
      release_tag:
        description: "Tag de la release (si publication)"
        required: false
        default: "v0.9.8-beta"   # les tags de releases immuables ne sont pas reutilisables

permissions:
  contents: write   # upload-artifact + release
  actions: read     # l'action SignPath telecharge l'artefact via github-token

jobs:
  build-and-sign:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Dependances Python
        run: |
          python -m venv .venv
          .venv\Scripts\python.exe -m pip install --upgrade pip
          .venv\Scripts\python.exe -m pip install -r requirements.txt pyinstaller

      - name: Inno Setup
        run: |
          choco install innosetup -y --no-progress
          echo "C:\Program Files (x86)\Inno Setup 6" >> $env:GITHUB_PATH

      - name: Build (exe + installeur)
        run: packaging\build.bat

      - name: Zip des binaires a signer
        run: |
          Compress-Archive -Path "dist\CerbereShield\CerbereShield.exe","dist\installer\CerbereShield_Setup.exe" -DestinationPath "signing-input.zip" -Force

      - name: Signature via API REST SignPath
        env:
          SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
          SIGNPATH_ORG: ${{ secrets.SIGNPATH_ORGANIZATION_ID }}
          PROJECT: ${{ inputs.project_slug }}
          POLICY: ${{ inputs.signing_policy }}
        run: |
          $base = "https://app.signpath.io/API/v1/$env:SIGNPATH_ORG"
          $h = @{ Authorization = "Bearer $env:SIGNPATH_API_TOKEN" }

          Write-Host "Soumission de signing-input.zip ($env:PROJECT / $env:POLICY)..."
          $resp = Invoke-RestMethod -Uri "$base/SigningRequests/SubmitWithArtifact" -Method Post -Headers $h -Form @{
            projectSlug       = $env:PROJECT
            signingPolicySlug = $env:POLICY
            description       = "CerbereShield CI build $($env:GITHUB_RUN_NUMBER)"
            artifact          = Get-Item "signing-input.zip"
          }
          $id = $resp.signingRequest.id
          if (-not $id) { $id = $resp.signingRequestId }
          if (-not $id) { $resp | ConvertTo-Json -Depth 5; throw "Pas d'id de signing request dans la reponse" }
          Write-Host "Signing request id: $id"

          do {
            Start-Sleep 15
            $s = Invoke-RestMethod -Uri "$base/SigningRequests/$id/Status" -Headers $h
            Write-Host "Statut: $($s.status)"
          } while ($s.status -notin @('Completed','Failed','Canceled','Denied'))

          if ($s.status -ne 'Completed') { throw "Signature echouee: $($s.status)" }

          New-Item -ItemType Directory -Path signed -Force | Out-Null
          Invoke-WebRequest -Uri "$base/SigningRequests/$id/SignedArtifact" -Headers $h -OutFile signed.zip
          Expand-Archive signed.zip -DestinationPath signed -Force
          Get-ChildItem signed -Recurse

      - name: Extraction des binaires signes
        run: |
          Get-ChildItem signed -Recurse -Filter *.zip | ForEach-Object {
            Expand-Archive $_.FullName -DestinationPath signed -Force
          }
          Get-ChildItem signed -Recurse

      - name: Verification des signatures (Authenticode)
        run: |
          $bad = @()
          Get-ChildItem signed -Recurse -Include *.exe,*.dll | ForEach-Object {
            $sig = Get-AuthenticodeSignature $_.FullName
            $subj = if ($sig.SignerCertificate) { $sig.SignerCertificate.Subject } else { "(aucun certificat)" }
            "{0} -> {1} ({2})" -f $_.Name, $sig.Status, $subj
            # UnknownError = racine de confiance absente du runner CI : OK si
            # le certificat est bien attache. Echec seulement si non signe/corrompu.
            if (-not $sig.SignerCertificate -or $sig.Status -in @('NotSigned','HashMismatch','Incompatible')) { $bad += $_.Name }
          }
          if ($bad) { throw "Signature manquante ou invalide : $($bad -join ', ')" }

      - name: Zip portable (sans installation)
        run: |
          $dst = "portable\CerbereShield"
          New-Item -ItemType Directory -Path $dst -Force | Out-Null
          Copy-Item "dist\CerbereShield\*" $dst -Recurse -Force
          # L'exe signe remplace le binaire non signe du dossier
          Copy-Item "signed\CerbereShield.exe" "$dst\CerbereShield.exe" -Force
          Copy-Item "scripts" "$dst\scripts" -Recurse -Force
          $sys = "systray_client\bin\Release\net6.0-windows\win-x64\publish\WebPortSystray.exe"
          if (Test-Path $sys) { Copy-Item $sys $dst -Force }
          Compress-Archive -Path "portable\CerbereShield" -DestinationPath "CerbereShield_portable.zip" -Force

      - uses: actions/upload-artifact@v4
        with:
          name: signed-package
          path: |
            signed
            CerbereShield_portable.zip

      - name: Release GitHub en draft (optionnel)
        if: inputs.publish_release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag }}
          name: Cerbere Shield ${{ inputs.release_tag }} (signe)
          prerelease: ${{ startsWith(inputs.release_tag, 'v1.') == false }}
          draft: true   # releases immuables : assets acceptes seulement en draft
          files: |
            signed/**/*.exe
            CerbereShield_portable.zip

      - name: Publication de la release
        if: inputs.publish_release
        run: gh release edit "${{ inputs.release_tag }}" --draft=false
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
